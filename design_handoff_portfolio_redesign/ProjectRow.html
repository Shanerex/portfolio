<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:grid; grid-template-columns:64px 1fr; gap:24px; padding:32px 0; border-bottom:1px solid var(--line); align-items:start;">
  <div style="font-family:'JetBrains Mono',ui-monospace,monospace; font-size:34px; font-weight:600; color:transparent; -webkit-text-stroke:1px var(--ink-mute); line-height:1;">{{ proj.idx }}</div>
  <div>
    <div style="display:flex; justify-content:space-between; align-items:baseline; gap:16px; flex-wrap:wrap;">
      <h3 style="font-family:'Bricolage Grotesque',system-ui,sans-serif; font-weight:700; font-size:clamp(22px,2.4vw,28px); margin:0; letter-spacing:-.01em; color:var(--ink);">{{ proj.name }}</h3>
      <div style="display:flex; align-items:center; gap:10px; flex:none;">
        <span style="font-family:'JetBrains Mono',ui-monospace,monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:{{ statusColor }};">{{ statusLabel }}</span>
        <span style="font-family:'JetBrains Mono',ui-monospace,monospace; font-size:12px; color:var(--ink-mute);">{{ proj.stack }}</span>
      </div>
    </div>
    <div style="margin-top:12px; display:flex; flex-direction:column; gap:8px; max-width:760px;">
      <sc-for list="{{ proj.description }}" as="line" hint-placeholder-count="3">
        <p style="font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:15px; line-height:1.6; color:var(--ink); opacity:.78; margin:0;">{{ line }}</p>
      </sc-for>
    </div>
    <sc-if value="{{ hasHref }}" hint-placeholder-val="{{ false }}">
      <a href="{{ proj.href }}" target="_blank" rel="noreferrer" style="display:inline-flex; align-items:center; gap:8px; margin-top:16px; font-family:'JetBrains Mono',ui-monospace,monospace; font-size:12.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); text-decoration:none; border-bottom:1px solid var(--line-strong); padding-bottom:4px; transition:color .2s ease, border-color .2s ease;" style-hover="color:{{ proj.accentText }}; border-color:{{ proj.accentText }};">View repo ↗</a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:220},&quot;proj&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const proj = this.props.proj || {};
    return {
      proj,
      hasHref: !!proj.href,
      statusLabel: proj.status === 'in-progress' ? 'In progress' : 'Completed',
      statusColor: proj.status === 'in-progress' ? (proj.accent2Text || '#FF5A4E') : 'var(--ink-mute)'
    };
  }
}
</script>
</body>
</html>
